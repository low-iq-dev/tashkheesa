# render.yaml — Tashkheesa portal, Render Blueprint (Infrastructure as Code)
# =============================================================================
# AUDIT-2026-08-22 (AUDIT-DEPLOY-1) — WHY THIS FILE EXISTS.
#
# Before it, the repo had no render.yaml, no Procfile and no Dockerfile. The
# start command and the ENTIRE environment-variable set lived only in the Render
# dashboard: unversioned, un-reviewable, and impossible to diff against a commit.
# This service has an unusually large number of HARD BOOT ASSERTS — src/bootCheck.js
# and src/server.js's validateCriticalEnvVars() between them call process.exit(1)
# for a missing MODE, SLA_MODE, SLA_PRIMARY_TOKEN, BASIC_AUTH_*, DATABASE_URL,
# JWT_SECRET, ANTHROPIC_API_KEY, RESEND_API_KEY,
# BASE_URL, APP_URL, UPLOADCARE_PUBLIC_KEY, all four R2_* vars and a non-live
# PAYMENT_MODE/PAYMOB_MODE — plus src/job_queue.js exits for a missing
# DATABASE_URL_DIRECT. Every one of those is a crash-loop discovered only after a
# deploy starts. "We forgot one" was the single largest deploy risk on this
# service.
#
# NATIONAL_ID_ENCRYPTION_KEY and OPENCLAW_BASE_URL/OPENCLAW_SEND_KEY are checked
# too, but only WARN until STRICT_ENV_ASSERTS=true (see that key below) —
# AUDIT-BOOT-MIGRATION-1.
#
# HOW TO USE IT
#   Render → Blueprints → New Blueprint Instance → point at this repo.
#   An EXISTING service can adopt it: Render → Service → Settings → link the
#   blueprint. `sync: false` vars are NOT overwritten by a blueprint sync, so
#   adopting this will not clobber secrets already set in the dashboard.
#
# THE RULE
#   Every var listed here with a `value:` is the PRODUCTION value and is
#   reviewable in git. Every var with `sync: false` is a secret or an
#   account-specific value that must be set in the Render dashboard ONCE and is
#   deliberately absent from the repo. NEVER put a real secret in this file.
#
# DERIVED FROM (re-derive, do not guess, when either changes):
#   src/bootCheck.js                        — MODE, SLA_MODE, SLA_PRIMARY_TOKEN,
#                                             ALLOW_PRIMARY_IN_DEV, BASIC_AUTH_*/
#                                             STAGING_*, DATABASE_URL,
#                                             NATIONAL_ID_ENCRYPTION_KEY, OPENCLAW_*
#   src/server.js validateCriticalEnvVars() — alwaysRequired + prodRequired +
#                                             prodWarn + the launch-switch VALUE
#                                             checks (PAYMENT_MODE, PAYMOB_MODE,
#                                             EMAIL_ENABLED, WHATSAPP_ENABLED)
#   src/job_queue.js                        — DATABASE_URL_DIRECT
# The full catalogue of optional/tuning variables, with explanations, stays in
# .env.example. This file carries what a production deploy CANNOT boot without,
# plus the switches whose wrong value ships a silently broken platform.
# =============================================================================

services:
  - type: web
    name: tashkheesa-portal
    runtime: node
    plan: starter
    region: frankfurt          # closest Render region to the Egyptian market
    branch: main
    autoDeploy: true

    # No build step in package.json — `npm ci` is the whole build.
    buildCommand: npm ci
    # Matches package.json "start". Do NOT put migrations here: src/db.js runs
    # them at boot under an advisory lock (AUDIT-MIGRATE-LOCK-1).
    startCommand: node src/server.js

    # src/routes/health.js mounts /healthz at the root. It reports per-worker
    # heartbeat freshness in the body but deliberately stays 200 when a worker is
    # down, so Render restarts only on a genuinely dead web process. Worker
    # liveness is alarmed separately (UptimeRobot + the ops push path).
    healthCheckPath: /healthz

    envVars:
      # ── Mode. Boot-asserted by bootCheck.js:20-24. ───────────────────────
      - key: MODE
        value: production
      - key: NODE_ENV
        value: production
      # src/server.js forces process.env.TZ='UTC' regardless; declared so the
      # value is visible and matches the DB session pin in src/pg.js.
      - key: TZ
        value: UTC
      # PORT is injected by Render — do NOT set it here.

      # ── Database ─────────────────────────────────────────────────────────
      # DATABASE_URL: Supabase TRANSACTION-mode pooler (port 6543).
      - key: DATABASE_URL
        sync: false
      # DATABASE_URL_DIRECT: Supabase SESSION pooler (port 5432). REQUIRED.
      # src/job_queue.js:27-39 process.exit(1)s without it in production, because
      # pg-boss needs LISTEN/NOTIFY and session advisory locks. src/db.js also
      # takes the migration advisory lock on it, and scripts/backup-db.js dumps
      # from it — a transaction pooler can serve none of those.
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: PG_SSL
        value: "true"
      # Connection budget against the 15-slot Supabase ceiling:
      #   8 (request pool) + 6 (pg-boss) + 1 (Supabase internals/burst) = 15.
      # AUDIT-2026-08-22 (AUDIT-BOSS-POOL-2) — was 10 + 4. pg-boss registers SIX
      # workers (case-intelligence, case-reprocess, auto-assign,
      # specialty-classify, sla-sweep, ai-canary), three with teamSize 2, plus
      # maintenance and monitor connections; at max=4 its own fetch/complete
      # queries queued and sla-sweep / auto-assign stalled. The boot-time
      # migration advisory-lock client is closed before pg-boss starts, so it
      # never coincides with the 6. Raise ONLY together with the Supabase tier,
      # and keep PG_POOL_MAX + PG_BOSS_POOL_MAX <= 14.
      - key: PG_POOL_MAX
        value: "8"
      - key: PG_BOSS_POOL_MAX
        value: "6"
      - key: PG_STATEMENT_TIMEOUT_MS
        value: "30000"
      # AUDIT-2026-08-22 (AUDIT-STARTUP-OPTIONS-2) — THE RECOVERY LEVER.
      # src/pg.js can append `?options=-c timezone=UTC -c statement_timeout=...`
      # to DATABASE_URL. That is now OPT-IN and OFF here, because Supavisor
      # consumes the `options` startup parameter itself for `reference=<project-
      # ref>` tenant routing — sending our own value is an all-or-nothing boot
      # gamble whose failure mode is every connection failing ~2s in. timezone
      # and statement_timeout come from the ALTER ROLE defaults in the operator
      # note at the bottom of this file instead.
      #
      # If a future pooler change makes startup options desirable, set this to
      # `on` here. If a deploy ever fails at boot with connection errors and
      # this is anything but `off`, set it to `off` — that is the one-variable
      # rollback. (src/pg.js preflightPool() already self-heals that case and
      # logs it, so this should never be needed mid-incident.)
      - key: PG_STARTUP_OPTIONS
        value: "off"

      # ── SLA / worker mode ────────────────────────────────────────────────
      # SLA_MODE=primary is the ONLY value that starts the notification worker,
      # the SLA sweep, the acceptance watcher, the video scheduler and the
      # reminder crons. In `passive` the platform queues every notification and
      # sends none, forever, while the in-app bell still fills.
      #
      # This service MUST stay at ONE INSTANCE. Two primaries double-send and
      # race the SLA sweep. If a second instance is ever added it runs `passive`.
      - key: SLA_MODE
        value: primary
      # Without this exact string bootCheck.js:47-53 exits 1 and Render crash-loops.
      - key: SLA_PRIMARY_TOKEN
        value: YES_I_UNDERSTAND
      - key: SLA_ENFORCEMENT_ENABLED
        value: "1"
      - key: SLA_ENFORCEMENT_INTERVAL_MS
        value: "300000"
      - key: SLA_REMINDER_MINUTES
        value: "60"
      - key: SLA_DRY_RUN
        value: "false"
      - key: NOTIFICATION_WORKER_ENABLED
        value: "true"
      - key: NOTIFICATION_WORKER_INTERVAL_MS
        value: "30000"
      - key: NOTIFICATION_DRY_RUN
        value: "false"

      # ── Auth & crypto (all secrets) ──────────────────────────────────────
      # alwaysRequired in src/server.js:90 — fatal in every mode.
      - key: JWT_SECRET
        generateValue: true
      # bootCheck.js:71-86. Either this pair OR STAGING_USER/STAGING_PASS; both
      # are honoured by src/server.js:243-244. Set ONE pair, not both.
      # `demo`/`demo123` is rejected in production.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
      # pgcrypto key for users.national_id_encrypted. Doctor signup THROWS on the
      # first national-ID write without it (src/services/national-id.js:23-25).
      # Rotating it later requires re-encrypting every row in one transaction —
      # set it once, before the first doctor signs up, and never change it.
      # bootCheck.js WARNS if unset; it becomes fatal once STRICT_ENV_ASSERTS=true.
      - key: NATIONAL_ID_ENCRYPTION_KEY
        sync: false
      - key: SESSION_COOKIE_NAME
        value: tashkheesa_portal
      - key: CSRF_MODE
        value: enforce
      - key: TASH_API_KEY
        generateValue: true
      - key: PUBLIC_ORDER_API_KEY
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true

      # ── URLs (prodRequired, src/server.js:97-107) ────────────────────────
      # No trailing slash. Used for Paymob callbacks, video return URLs, email
      # links and JSON-LD. Wrong here means broken redirects, not a crash.
      - key: BASE_URL
        value: https://tashkheesa.com
      - key: APP_URL
        value: https://tashkheesa.com
      # AUDIT-2026-08-22 (AUDIT-MEDIA-BASE-1) — was `https://tashkheesa.com`,
      # the bare origin. src/instagram/config.js:14 defaults this to
      # `https://tashkheesa.com/media/instagram`, and the value is used as the
      # PREFIX for every Instagram media URL — the bare origin rewrote every
      # image to the site root, so Meta fetched the homepage instead of a JPEG.
      # Must match the code default unless the media host actually moves.
      - key: MEDIA_BASE_URL
        value: https://tashkheesa.com/media/instagram

      # ── AI (alwaysRequired) ──────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Email (prodRequired: RESEND_API_KEY) ─────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      # src/server.js:222-229 WARNS (does not exit) when this is not exactly
      # "true" — every email send is then silently marked "skipped".
      - key: EMAIL_ENABLED
        value: "true"
      - key: SMTP_FROM_EMAIL
        value: noreply@tashkheesa.com
      - key: SMTP_FROM_NAME
        value: Tashkheesa
      - key: SMTP_REPLY_TO_EMAIL
        value: info@tashkheesa.com
      - key: APPLICATIONS_NOTIFY_EMAIL
        value: info@tashkheesa.com
      - key: EMAIL_GUARD_STRICT
        value: "false"

      # ── WhatsApp ─────────────────────────────────────────────────────────
      # NOTIFICATIONS_WHATSAPP_ENABLED=true + TRANSPORT=openclaw makes
      # OPENCLAW_BASE_URL and OPENCLAW_SEND_KEY boot-checked (bootCheck.js) —
      # a WARNING until STRICT_ENV_ASSERTS=true, fatal after.
      # Without them every send returns oc_env_misconfigured and ZERO WhatsApp is
      # delivered — silently. To launch without WhatsApp, set this to "false"
      # deliberately rather than leaving the OPENCLAW_* vars blank.
      - key: NOTIFICATIONS_WHATSAPP_ENABLED
        value: "true"
      - key: NOTIFICATIONS_WHATSAPP_TRANSPORT
        value: openclaw
      - key: OPENCLAW_BASE_URL
        sync: false
      - key: OPENCLAW_SEND_KEY
        sync: false
      # src/server.js:222-229 warns when WHATSAPP_ENABLED is not "true" (this
      # gates the Meta Cloud API path + OTP, separately from the flag above).
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_API_VERSION
        value: v22.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_NAME
        value: otp_verify_en
      - key: WHATSAPP_OTP_TEMPLATE_LANG
        value: en
      # prodWarn (src/server.js:153-157) — crash-alert WhatsApp no-ops without it.
      # Digits with country code, no leading '+'.
      - key: ADMIN_PHONE
        sync: false

      # ── Payments — FATAL VALUE CHECK ─────────────────────────────────────
      # src/server.js:203-217 process.exit(1)s in production unless BOTH of these
      # are exactly "live" (or ALLOW_NON_LIVE_PAYMENTS=1 is set, staging only).
      # Anything else means patients get SIMULATED payment success without being
      # charged.
      - key: PAYMENT_MODE
        value: live
      - key: PAYMOB_MODE
        value: live
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_CARD_INTEGRATION_ID
        sync: false
      - key: PAYMOB_NOTIFICATION_URL
        value: https://tashkheesa.com/payments/callback

      # ── File storage: Uploadcare (prodRequired) ──────────────────────────
      # The patient new-case wizard and doctor signup load the widget with this
      # key; unset renders the widget unconfigured and patients cannot upload.
      # UPLOADCARE_SECRET_KEY is deliberately NOT listed — no server-side
      # consumer exists (see the note in src/server.js:113-121).
      - key: UPLOADCARE_PUBLIC_KEY
        sync: false

      # ── File storage: Cloudflare R2 (prodRequired — all four together) ───
      # Prescription PDFs, case reports, patient uploads, doctor photos and
      # signatures. Missing any one of them makes the first upload/download throw
      # inside the request handler.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

      # ── Business info (homepage footer + JSON-LD) ────────────────────────
      - key: BUSINESS_EMAIL
        value: info@tashkheesa.com
      - key: BUSINESS_PHONE
        value: "+20 110 200 9886"
      - key: BUSINESS_ADDRESS
        value: Cairo, Egypt
      - key: PRICE_RANGE_MIN
        value: "200"
      - key: PRICE_RANGE_MAX
        value: "18,250"
      - key: BRAND_NAME
        value: Tashkheesa

      # ── Ops dashboard ────────────────────────────────────────────────────
      - key: OPS_USER
        sync: false
      - key: OPS_PASS
        sync: false
      - key: OPS_AGENT_KEY
        sync: false

      # ── Boot-assert severity ─────────────────────────────────────────────
      # AUDIT-2026-08-22 (AUDIT-BOOT-MIGRATION-1). src/bootCheck.js's two NEWEST
      # checks — NATIONAL_ID_ENCRYPTION_KEY, and OPENCLAW_BASE_URL +
      # OPENCLAW_SEND_KEY when WhatsApp is on — guard variables that are
      # `sync: false` above, i.e. they do not exist until an operator types them
      # into the dashboard. Shipping them as hard asserts would crash-loop the
      # FIRST deploy of that change, after the previous deploy is already gone.
      #
      # They therefore WARN (`⚠️  BOOT CHECK WARNING` in the deploy log) while
      # this is "false". FLIP IT TO "true" once the deploy log shows no such
      # warnings — from then on a regression that unsets one of those secrets
      # fails the deploy instead of shipping a silently broken platform.
      - key: STRICT_ENV_ASSERTS
        value: "false"

      # ── Feature flags held OFF for launch ────────────────────────────────
      - key: ADDON_SYSTEM_V2
        value: "false"
      - key: VIDEO_CONSULTATION_ENABLED
        value: "false"

# =============================================================================
# MUST NEVER BE SET ON THIS SERVICE — each one makes a broken deploy look healthy:
#   SEED_DEMO_DATA=1          seeds demo users/orders into production
#   WHATSAPP_TEST_STUB=true   every WhatsApp send returns success, sends nothing
#   EMAIL_TEST_STUB=true      every email send returns success, sends nothing
#   RATE_LIMIT_DISABLED=true  removes the patient case-submission limiter
#   ALLOW_NON_LIVE_PAYMENTS=1 permits stubbed payments (staging only)
#   ALLOW_PRIMARY_IN_DEV      development-only guardrail; meaningless here
#   SLA_MODE=passive          queues every notification and sends none
#
# ONE-TIME OPERATOR SETUP, not expressible in this file:
#   1. ALTER ROLE <app role> SET timezone = 'UTC';
#      ALTER ROLE <app role> SET statement_timeout = '30s';
#      REQUIRED, not optional. Since PG_STARTUP_OPTIONS is off (see above), this
#      is the ONLY mechanism that reliably sets both on every backend the
#      Supavisor pooler can route to — role defaults are applied by the backend
#      at connection start regardless of pooler. Verify from the deploy log:
#      grep for `[pg] verified on`.
#
#      SAFE WITH THE MIGRATION RUNNER: a role-level statement_timeout also
#      applies to src/db.js's dedicated migration Client, which carries no
#      per-connection override. Under the old code that meant any migration —
#      or the advisory-lock wait itself — running past 30s was CANCELLED, the
#      runner threw, and the service crash-looped permanently with no skip
#      mechanism. src/db.js now issues `SET statement_timeout = 0` (plus
#      `SET TIME ZONE 'UTC'` and a lock_timeout) on that session immediately
#      after connect, and takes the lock with a BOUNDED pg_try_advisory_lock
#      retry instead of a blocking pg_advisory_lock. Do not remove either.
#   2. Confirm the app's DB role has rolbypassrls = true, or migration 070's
#      default-deny RLS makes every table return zero rows. See the RLS check in
#      src/migrations/070_rls_enable_default_deny.sql.
#   3. pg_dump/pg_restore are NOT on the Render image. Take launch backups
#      (`npm run backup:db`) from an operator machine against DATABASE_URL_DIRECT,
#      or from Supabase → Database → Backups.
# =============================================================================
